<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mufuki | Photo, Livestream, Podcast</title>
  <meta name="description" content="Photography, livestreaming and podcast recording in Ottawa. See my work and book a session.">
  <link rel="icon" type="image/png" href="images/favicon.png">
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/site.css">
</head>
<body data-page="portfolio">
<!-- The menu at the top and the footer are added by assets/site.js (same on every page). -->
<main id="top">
  <section class="page-head">
    <div class="wrap">
      <h1 data-i18n="work.title">Portfolio</h1>
      <p class="lede" data-i18n="work.lede">A selection of concerts, events, portraits and livestreams.</p>
    </div>
  </section>
  <section id="work">
    <div class="wrap">
      <div class="filters" role="group" aria-label="Filter portfolio">
        <button type="button" data-filter="all" aria-pressed="true" data-i18n="f.all">All</button>
        <button type="button" data-filter="concerts" aria-pressed="false" data-i18n="f.concerts">Concerts</button>
        <button type="button" data-filter="events" aria-pressed="false" data-i18n="f.events">Events</button>
        <button type="button" data-filter="portraits" aria-pressed="false" data-i18n="f.portraits">Portraits</button>
        <button type="button" data-filter="livestreams" aria-pressed="false" data-i18n="f.livestreams">Livestreams</button>
      </div>
      <div class="grid" id="grid"></div>
    </div>
  </section>
  <dialog id="lightbox" aria-label="Photo viewer">
    <button type="button" aria-label="Close">&times;</button>
    <img alt="">
  </dialog>
</main>
<script src="assets/config.js"></script>
<script src="assets/site.js"></script>
</body>
</html>
