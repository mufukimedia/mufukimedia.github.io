<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mufuki | Photo, Livestream, Podcast</title>
  <meta name="description" content="Photography, livestreaming and podcast recording in Ottawa. See my work and book a session.">
  <link rel="icon" type="image/png" href="images/favicon.png">
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/site.css">
</head>
<body data-page="book">
<!-- The menu at the top and the footer are added by assets/site.js (same on every page). -->
<main id="top">
  <section class="page-head">
    <div class="wrap">
      <h1 data-i18n="book.title">Book a session</h1>
      <p class="lede" data-i18n="book.lede">Choose an open time in my calendar, or send your details and I'll reply within 48 hours.</p>
    </div>
  </section>
  <section id="book">
    <div class="wrap book-grid">
      <div>
        <p class="contact-alt"><span data-i18n="book.direct">Prefer to message directly?</span><br>
          <span data-i18n="book.email">Email</span> <a href="mailto:bookings@mufuki.ca">bookings@mufuki.ca</a><br>
          Instagram <a href="https://instagram.com/mufuki_" target="_blank" rel="noopener">@mufuki_</a>
        </p>
      </div>

      <div>
        <div class="tabs" role="tablist" aria-label="Booking options">
          <button type="button" role="tab" id="tabCal" aria-controls="panelCal" aria-selected="true" data-i18n="book.tabCal">Pick a time</button>
          <button type="button" role="tab" id="tabForm" aria-controls="panelForm" aria-selected="false" tabindex="-1" data-i18n="book.tabForm">Send a request</button>
        </div>

        <div role="tabpanel" id="panelCal" aria-labelledby="tabCal">
          <div id="cal-inline"></div>
          <div class="cal-empty" id="calEmpty" hidden>
            <p data-i18n="book.calSoon">Online scheduling is coming soon. Send a request instead and I'll reply with open dates.</p>
            <button class="btn btn-solid" type="button" id="calToForm" data-i18n="book.tabForm">Send a request</button>
          </div>
        </div>

        <div role="tabpanel" id="panelForm" aria-labelledby="tabForm" hidden>
          <!-- Paste your Formspree form link into action="..." (see README) -->
          <form id="booking" action="https://formspree.io/f/mzedjyar" method="POST">
            <div>
              <label class="field" for="name" data-i18n="form.name">Your name</label>
              <input id="name" name="name" autocomplete="name" required>
            </div>
            <div>
              <label class="field" for="email" data-i18n="form.email">Email</label>
              <input id="email" name="email" type="email" autocomplete="email" required>
            </div>
            <div>
              <label class="field" for="phone" data-i18n="form.phone">Phone (optional)</label>
              <input id="phone" name="phone" type="tel" autocomplete="tel">
            </div>
            <div>
              <label class="field" for="service" data-i18n="form.service">Service</label>
              <select id="service" name="service" required>
                <option value="" data-i18n="form.choose">Choose a service</option>
                <option value="Photo shoot" data-i18n="svc1.title">Photo shoots</option>
                <option value="Livestreaming" data-i18n="svc2.title">Livestreaming</option>
                <option value="Podcast recording" data-i18n="svc3.title">Podcast recording</option>
                <option value="Not sure yet" data-i18n="form.unsure">Not sure yet</option>
              </select>
            </div>
            <div>
              <label class="field" for="date" data-i18n="form.date">Event date</label>
              <input id="date" name="date" type="date" required>
            </div>
            <div>
              <label class="field" for="location" data-i18n="form.location">Location</label>
              <input id="location" name="location" data-i18n-ph="form.locationPh" placeholder="Venue or neighbourhood">
            </div>
            <div class="full">
              <label class="field" for="message" data-i18n="form.message">Tell me about your event</label>
              <textarea id="message" name="message" data-i18n-ph="form.messagePh" placeholder="Type of event, start time, how long, anything special"></textarea>
            </div>
            <input type="hidden" name="language" id="formLang" value="en">
            <input type="hidden" name="_subject" value="New booking request from mufuki.ca">
            <div class="full">
              <button class="btn btn-solid" type="submit" data-i18n="form.submit">Send booking request</button>
            </div>
            <p class="status" id="status" role="status" aria-live="polite"></p>
          </form>
        </div>
      </div>
    </div>
  </section>
</main>
<script src="assets/config.js"></script>
<script src="assets/site.js"></script>
</body>
</html>
